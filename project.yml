# XcodeGen spec — turns this folder into Glide.xcodeproj.
# On a Mac:  brew install xcodegen && xcodegen generate
name: Glide
options:
  bundleIdPrefix: com.glide
  deploymentTarget:
    iOS: "26.0"
targets:
  Glide:
    type: application
    platform: iOS
    sources:
      - Glide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glide.motionapp
        PRODUCT_NAME: Glide
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Glide
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMotionUsageDescription: Glide uses motion to tilt cards when you turn on Tilt with phone.
        CODE_SIGN_STYLE: Automatic
